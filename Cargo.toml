[package]
name = "taxaebook"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
epub = "2.1.5"
flate2 = "1.1.10"
tar = "0.4.46"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
